name: Local and enterprise regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-enterprise.txt
      - name: Offline contract and security tests
        run: |
          python -m unittest discover -s tests -p test_workflow.py
          python -m unittest discover -s tests -p test_enterprise.py
          python -m unittest discover -s tests -p test_enterprise_ops.py
      - run: python scripts/setup_enterprise.py
      - run: docker compose --env-file .enterprise/compose.env -f compose.enterprise.yml config --quiet
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t enterprise-rag:ci .
