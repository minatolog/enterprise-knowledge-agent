name: enterprise-rag
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run setup_enterprise.py}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run setup_enterprise.py}", "--appendonly", "yes"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redisdata:/data"]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rag
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run setup_enterprise.py}
    ports: ["127.0.0.1:15673:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
  s3:
    image: chrislusf/seaweedfs:4.53
    command: ["server", "-dir=/data", "-ip=s3", "-ip.bind=0.0.0.0", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=5"]
    ports: ["127.0.0.1:19000:8333"]
    volumes: ["objects:/data", "s3config:/etc/seaweedfs"]
  otel:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/config/otel.yaml"]
    volumes: ["otelconfig:/config"]
    ports: ["127.0.0.1:14317:4317", "127.0.0.1:18889:8889"]
  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - promconfig:/etc/prometheus
    ports: ["127.0.0.1:19090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?run setup_enterprise.py}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafanaconfig:/etc/grafana/provisioning
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:13000:3000"]
  api:
    profiles: [app]
    build: .
    command: ["uvicorn", "app.enterprise.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.enterprise/container.env]
    ports: ["127.0.0.1:8030:8000"]
    volumes: ["enterprisestate:/state", "modelcache:/home/rag/.cache/huggingface"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_started}
      redis: {condition: service_started}
      s3: {condition: service_started}
  worker:
    profiles: [app]
    build: .
    command: ["celery", "-A", "app.enterprise.worker:app", "worker", "--concurrency=1", "--loglevel=WARNING"]
    env_file: [.enterprise/container.env]
    volumes: ["enterprisestate:/state", "modelcache:/home/rag/.cache/huggingface"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_started}
  scheduler:
    profiles: [app]
    build: .
    command: ["celery", "-A", "app.enterprise.worker:app", "beat", "--schedule=/state/celerybeat", "--loglevel=WARNING"]
    env_file: [.enterprise/container.env]
    volumes: ["enterprisestate:/state"]
    depends_on:
      rabbitmq: {condition: service_started}
volumes:
  pgdata:
  redisdata:
  rabbitdata:
  objects:
  grafanadata:
  s3config:
  otelconfig:
  promconfig:
  grafanaconfig:
  enterprisestate:
  modelcache:
